name: Android APK
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build APK
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace
      - run: cp android/app/build/outputs/apk/release/app-release.apk alhara.apk
      - uses: actions/upload-artifact@v4
        with:
          name: alhara-apk
          path: alhara.apk
      - name: Publish the APK as a release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete apk --yes --cleanup-tag || true
          gh release create apk alhara.apk --title "الحارة المجنونة — APK" --notes "نزّل alhara.apk على التابلت وثبّته (لازم تسمح بتثبيت التطبيقات من مصادر غير معروفة). التطبيق بيفتح أحدث نسخة من اللعبة على طول." --latest
